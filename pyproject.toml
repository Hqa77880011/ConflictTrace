[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "conflicttrace"
version = "0.1.0"
description = "Causal relation-guided evidential fusion implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "torch>=2.2", "opencv-python-headless>=4.8", "scikit-learn>=1.3", "matplotlib>=3.7"]
[project.scripts]
conflicttrace = "conflicttrace.cli:main"
[tool.setuptools.packages.find]
include = ["conflicttrace*"]
