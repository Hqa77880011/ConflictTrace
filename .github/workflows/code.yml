name: Code
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install .
      - run: python -m compileall -q conflicttrace
      - run: python -c "import conflicttrace; import conflicttrace.cli"
